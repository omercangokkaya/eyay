<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Döner Ustası — Atölye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap&subset=latin,latin-ext" rel="stylesheet">
<style>
  :root{ --smoke:#161110; --ember:#e2601c; --ember-hot:#ffb03a; --paper:#efe4ce; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--smoke)}
  body{font-family:"Barlow",system-ui,sans-serif;color:var(--paper);overscroll-behavior:none;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  #ui{position:fixed;inset:0;pointer-events:none;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
  #ui button{pointer-events:auto}

  .plate{
    background:linear-gradient(180deg,#2c2119,#1b1310);
    border:2px solid #0b0807;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.13), 0 6px 14px rgba(0,0,0,.5);
    padding:7px 12px 6px;
  }
  #top{display:flex;align-items:flex-start;gap:10px}
  #scorePlate{transform:rotate(-1.2deg)}
  #scorePlate .num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:42px;line-height:.9;display:block}
  #scorePlate .cap{font-size:12px;letter-spacing:.14em;color:#a8968a}
  #portions{transform:rotate(.8deg)}
  #portions .num{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:26px;line-height:1;display:block}
  #portions .cap{font-size:11px;letter-spacing:.12em;color:#a8968a}
  #combo{margin-left:auto;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;
    color:var(--ember-hot);opacity:0;transition:opacity .25s;text-shadow:0 0 16px rgba(226,96,28,.7)}
  #combo.on{opacity:1}

  #dials{position:fixed;left:14px;top:50%;transform:translateY(-50%);width:116px;
    display:flex;flex-direction:column;gap:12px;pointer-events:none}
  .dial{background:linear-gradient(180deg,#2c2119,#1b1310);border:2px solid #0b0807;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 6px 14px rgba(0,0,0,.5);padding:8px 10px 9px}
  .dcap{display:block;font-size:10px;letter-spacing:.14em;color:#8d7d71}
  .dval{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;
    color:#cbbca9;margin-top:3px;line-height:1}
  .dial input[type=range]{pointer-events:auto;-webkit-appearance:none;appearance:none;
    width:100%;height:16px;background:transparent;margin:7px 0 0;display:block;cursor:pointer}
  .dial input[type=range]::-webkit-slider-runnable-track{height:6px;background:#100c0b;
    border:1px solid #0b0807;box-shadow:inset 0 0 6px #000}
  .dial input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:17px;
    margin-top:-6px;background:linear-gradient(180deg,#f0a33c,#d9701c);border:1px solid #0b0807}
  .dial input[type=range]::-moz-range-track{height:6px;background:#100c0b;border:1px solid #0b0807}
  .dial input[type=range]::-moz-range-thumb{width:11px;height:17px;border-radius:0;
    background:linear-gradient(180deg,#f0a33c,#d9701c);border:1px solid #0b0807}
  .dial input[type=range]:focus-visible{outline:2px solid var(--ember-hot);outline-offset:3px}

  #gauge{position:fixed;right:14px;top:50%;transform:translateY(-50%);width:54px;pointer-events:none;text-align:center}
  #gaugeTrack{height:190px;width:20px;margin:0 auto 8px;background:#100c0b;border:2px solid #0b0807;
    box-shadow:inset 0 0 10px rgba(0,0,0,.8);position:relative;overflow:hidden}
  #gaugeFill{position:absolute;left:0;right:0;bottom:0;height:0%;
    background:linear-gradient(0deg,#c9566a 0%,#d98b3a 45%,#8a4a22 75%,#2a1a14 100%);transition:height .12s linear}
  #gaugeTicks{position:absolute;inset:0}
  #gaugeTicks i{position:absolute;left:0;right:0;height:1px;background:rgba(239,228,206,.22)}
  #gaugeLabel{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;letter-spacing:.06em;color:#cbbca9}
  #gaugeCap{font-size:10px;letter-spacing:.14em;color:#8d7d71;margin-bottom:6px}

  #stamp{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) rotate(-4deg);
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:38px;color:var(--paper);
    opacity:0;pointer-events:none;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.6)}
  #stamp .pts{display:block;font-size:18px;font-weight:600;letter-spacing:.1em;text-align:center;color:var(--ember-hot)}
  #stamp.show{animation:stampIn .85s ease-out forwards}
  @keyframes stampIn{
    0%{opacity:0;transform:translate(-50%,-50%) rotate(-4deg) scale(1.35)}
    18%{opacity:1;transform:translate(-50%,-50%) rotate(-4deg) scale(1)}
    70%{opacity:1;transform:translate(-50%,-58%) rotate(-4deg) scale(1)}
    100%{opacity:0;transform:translate(-50%,-72%) rotate(-4deg) scale(.95)}
  }

  #bottom{display:flex;flex-direction:column;align-items:center;gap:10px}
  #hint{font-size:13.5px;color:#b6a596;text-align:center;max-width:32ch;line-height:1.35}
  #hint b{color:var(--ember-hot);font-weight:600}
  #controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .btn{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;letter-spacing:.04em;
    color:#e6dccb;background:linear-gradient(180deg,#3a2c22,#221912);border:2px solid #0b0807;
    padding:7px 14px 6px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.45)}
  .btn:hover{background:linear-gradient(180deg,#4a382a,#2a1e16)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--ember-hot);outline-offset:2px}
  .btn.on{color:#1a1109;background:linear-gradient(180deg,#f0a33c,#d9701c)}

  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(60% 50% at 50% 45%,rgba(30,20,15,.72),rgba(12,9,8,.94));
    text-align:center;padding:24px;gap:14px;pointer-events:auto}
  #intro h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:min(15vw,76px);
    margin:0;line-height:.86;color:var(--paper)}
  #intro h1 span{display:block;color:var(--ember);font-size:.42em;letter-spacing:.24em;margin-top:10px}
  #intro p{max-width:34ch;font-size:15.5px;line-height:1.5;color:#c6b6a6;margin:0}
  #intro.hide{opacity:0;pointer-events:none;transition:opacity .45s}

  @media (max-width:520px){
    #scorePlate .num{font-size:34px}
    #gauge{width:44px}#gaugeTrack{height:150px}
    #dials{width:92px;gap:9px}
    .dial{padding:6px 8px 7px}
    #stamp{font-size:30px}
  }
  @media (prefers-reduced-motion:reduce){ #stamp.show{animation-duration:.01s} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="top">
    <div class="plate" id="scorePlate"><span class="cap">Puan</span><span class="num" id="score">0</span></div>
    <div class="plate" id="portions"><span class="cap">Porsiyon</span><span class="num" id="slices">0</span></div>
    <div id="combo"></div>
  </div>
  <div id="bottom">
    <div id="hint">Kesilecek yüzü bıçağa çevir, sonra <b>aşağı çek</b> &nbsp;·&nbsp; Yatay sürükle: <b>çevir</b></div>
    <div id="controls">
      <button class="btn" id="soundBtn">Sesi aç</button>
      <button class="btn" id="resetBtn">Yeni döner tak</button>
    </div>
  </div>
</div>

<div id="dials">
  <div class="dial">
    <span class="dcap">ATEŞ</span>
    <input id="fireDial" type="range" min="0" max="100" value="62" aria-label="Ateş derecesi">
    <span class="dval" id="fireVal">Orta</span>
  </div>
  <div class="dial">
    <span class="dcap">DEVİR</span>
    <input id="spinDial" type="range" min="0" max="100" value="0" aria-label="Dönme hızı">
    <span class="dval" id="spinVal">Kapalı</span>
  </div>
</div>

<div id="gauge">
  <div id="gaugeCap">BIÇAK ALTI</div>
  <div id="gaugeTrack">
    <div id="gaugeFill"></div>
    <div id="gaugeTicks"><i style="bottom:25%"></i><i style="bottom:50%"></i><i style="bottom:75%"></i></div>
  </div>
  <div id="gaugeLabel">Çiğ</div>
</div>

<div id="stamp"></div>

<div id="intro">
  <h1>Döner Ustası<span>ATÖLYE</span></h1>
  <p>Bıçak ete yaslanır, tek çekişte kâğıt inceliğinde bir yaprak kalkar. Pişen yüzü öne çevir, sonra yukarıdan aşağı çek.</p>
  <button class="btn" id="startBtn">Ocağı yak</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

// ───────────────────────── ızgara
const R = 240;                 // çevresel çözünürlük (dar şerit pürüzsüz çıksın)
const H = 56;                  // dikey halka
const TOPY = 1.14, BOTY = -1.14, SPAN = TOPY - BOTY;
const MINR = 0.085;
const SHAVE = 0.006;           // yaprağın orta yerindeki kalınlık
const CUT_HALF = 0.055;        // bıçağın temas ettiği yarım yay = şerit genişliği
const NC = Math.max(2, Math.round(CUT_HALF / (Math.PI*2/R)));
const CUT_PHI = 0.60;                   // bıçak hep burada durur: sağ yanak, ~34°
const FIRE_A = Math.PI * 1.08;
const FIRE_DIR = new THREE.Vector3(Math.cos(FIRE_A), 0, Math.sin(FIRE_A));
const TRAY_Y = -1.42;

const rad  = new Float32Array(R * (H + 1));
const cook = new Float32Array(R * (H + 1));

let scene, camera, renderer, clock, camBase;
let donerGroup, meatMesh, meatGeo, meatPos, meatCol;
let knife, knifeTilt, knifeRoll, bladeGlow, fireLight, firePoints, fireData;
let bits, bitData, steam, steamData;
let spinVel = 0, geoDirty = true, colorTick = 0, shake = 0;
let fireLevel = 0.93;     // ocak derecesi (0 = sönük)
let spinRate = 0;         // motorun devri, rad/sn
const rodMats = [];
let score = 0, portions = 0, combo = 0;
const slices = [];

const el = id => document.getElementById(id);
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const wrap = i => ((i % R) + R) % R;
function smoothstep(a,b,x){ const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }

// ───────────────────────── et gövdesi
function baseRadius(t){
  const grow  = smoothstep(0.0, 0.11, t);
  const taper = 1.0 - 0.70 * smoothstep(0.52, 1.0, t);
  const bulge = 1.0 + 0.09 * Math.sin(t * Math.PI);
  return (0.17 + 0.41 * grow) * taper * bulge;
}

function resetDoner(){
  for(let j=0;j<=H;j++){
    const t = j / H, br = baseRadius(t);
    for(let i=0;i<R;i++){
      const n = 0.022*Math.sin(i*0.48 + j*0.25) + 0.014*Math.sin(i*1.27 - j*0.61);
      rad[j*R+i] = br * (1 + n);
      cook[j*R+i] = 0.02 + 0.03*Math.random();
    }
  }
  geoDirty = true;
}

const C_RAW=[0.78,0.30,0.33], C_MID=[0.74,0.42,0.20], C_DONE=[0.43,0.22,0.09], C_CHAR=[0.11,0.08,0.07];
const _c = [0,0,0];
function cookColor(c, out){
  let a,b,f;
  if(c < 0.45){ a=C_RAW; b=C_MID; f=c/0.45; }
  else if(c < 0.88){ a=C_MID; b=C_DONE; f=(c-0.45)/0.43; }
  else { a=C_DONE; b=C_CHAR; f=clamp((c-0.88)/0.42,0,1); }
  out[0]=a[0]+(b[0]-a[0])*f; out[1]=a[1]+(b[1]-a[1])*f; out[2]=a[2]+(b[2]-a[2])*f;
  return out;
}

// ───────────────────────── sahne
function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x120d0c);
  scene.fog = new THREE.Fog(0x120d0c, 6.0, 13.0);

  camera = new THREE.PerspectiveCamera(42, 1, 0.1, 60);
  camera.position.set(0.05, 0.42, 4.35);
  camera.lookAt(0, 0.02, 0);
  camBase = camera.position.clone();

  renderer = new THREE.WebGLRenderer({ canvas: el('c'), antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  clock = new THREE.Clock();

  buildRoom(); buildMachine(); buildDoner(); buildFire();
  buildKnife(); buildBits(); buildSteam();

  resize();
  addEventListener('resize', resize);
  animate();
}

function buildRoom(){
  scene.add(new THREE.AmbientLight(0x30201a, 1.0));
  const key = new THREE.DirectionalLight(0xffd9b0, 0.55); key.position.set(2.4,3.2,3.0); scene.add(key);
  const rim = new THREE.DirectionalLight(0x5a7fa8, 0.35); rim.position.set(-2.5,1.5,-3.0); scene.add(rim);
  fireLight = new THREE.PointLight(0xff7a22, 2.6, 7.5, 2);
  fireLight.position.set(FIRE_DIR.x*1.1, 0.15, FIRE_DIR.z*1.1);
  scene.add(fireLight);

  const counter = new THREE.Mesh(new THREE.BoxGeometry(7,0.22,3.2),
    new THREE.MeshStandardMaterial({ color:0x8d949a, metalness:0.85, roughness:0.42 }));
  counter.position.set(0,-1.62,0.25); scene.add(counter);

  const wall = new THREE.Mesh(new THREE.PlaneGeometry(16,9),
    new THREE.MeshStandardMaterial({ color:0x1d1614, roughness:0.95 }));
  wall.position.set(0,1.6,-3.2); scene.add(wall);
}

function buildMachine(){
  const steel = new THREE.MeshStandardMaterial({ color:0x9aa2a8, metalness:0.9, roughness:0.33 });
  const dark  = new THREE.MeshStandardMaterial({ color:0x2b2b2e, metalness:0.7, roughness:0.55 });
  const g = new THREE.Group();

  const base = new THREE.Mesh(new THREE.BoxGeometry(1.9,0.12,1.1), steel); base.position.y=-1.46; g.add(base);
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.16,3.0,0.16), steel);
  post.position.set(FIRE_DIR.x*1.35, 0.05, FIRE_DIR.z*1.35 - 0.35); g.add(post);
  const motor = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.34,0.5), steel); motor.position.set(0,1.55,-0.05); g.add(motor);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.34,12), dark); cap.position.set(0,1.3,0); g.add(cap);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.12,0.14), steel);
  arm.position.set(FIRE_DIR.x*0.68, 1.62, FIRE_DIR.z*0.68 - 0.18);
  arm.rotation.y = -FIRE_A + Math.PI; g.add(arm);

  const tray = new THREE.Mesh(new THREE.CylinderGeometry(1.02,0.86,0.13,28), steel);
  tray.position.set(0, TRAY_Y-0.05, 0.06); g.add(tray);
  const trayIn = new THREE.Mesh(new THREE.CylinderGeometry(0.93,0.82,0.04,28),
    new THREE.MeshStandardMaterial({ color:0x6f7378, metalness:0.8, roughness:0.5 }));
  trayIn.position.set(0, TRAY_Y+0.02, 0.06); g.add(trayIn);

  const thetaC = Math.PI/2 - FIRE_A;
  const panel = new THREE.Mesh(
    new THREE.CylinderGeometry(1.16,1.16,2.6,20,1,true, thetaC-0.42, 0.84),
    new THREE.MeshStandardMaterial({ color:0x22201f, metalness:0.6, roughness:0.7, side:THREE.DoubleSide }));
  panel.position.y = 0.05; g.add(panel);

  for(let k=-3;k<=3;k++){
    const a = FIRE_A + k*0.105;
    const rodMat = new THREE.MeshStandardMaterial({ color:0x3a1206, emissive:0xff4a08, emissiveIntensity:1.5, roughness:0.6 });
    rodMats.push(rodMat);
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,2.3,8), rodMat);
    rod.position.set(Math.cos(a)*1.05, 0.05, Math.sin(a)*1.05); g.add(rod);
  }
  scene.add(g);
}

function buildDoner(){
  donerGroup = new THREE.Group();
  scene.add(donerGroup);

  const skew = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,2.9,12),
    new THREE.MeshStandardMaterial({ color:0x8e959b, metalness:0.95, roughness:0.25 }));
  donerGroup.add(skew);

  const onion = new THREE.Mesh(new THREE.SphereGeometry(0.17,16,12),
    new THREE.MeshStandardMaterial({ color:0xf0e2cf, roughness:0.75 }));
  onion.scale.y=0.62; onion.position.y=TOPY+0.14; donerGroup.add(onion);
  const tomato = new THREE.Mesh(new THREE.SphereGeometry(0.15,16,12),
    new THREE.MeshStandardMaterial({ color:0xc0301f, roughness:0.45 }));
  tomato.scale.y=0.78; tomato.position.y=TOPY+0.34; donerGroup.add(tomato);

  const vCount = (R+1)*(H+1);
  meatGeo = new THREE.BufferGeometry();
  meatPos = new Float32Array(vCount*3);
  meatCol = new Float32Array(vCount*3);
  const idx = [];
  for(let j=0;j<H;j++) for(let i=0;i<R;i++){
    const a = j*(R+1)+i, b = a+1, c = (j+1)*(R+1)+i, d = c+1;
    idx.push(a,c,b, b,c,d);
  }
  meatGeo.setAttribute('position', new THREE.BufferAttribute(meatPos,3));
  meatGeo.setAttribute('color', new THREE.BufferAttribute(meatCol,3));
  meatGeo.setIndex(idx);
  meatMesh = new THREE.Mesh(meatGeo, new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:0.6, metalness:0.04 }));
  donerGroup.add(meatMesh);

  resetDoner(); refreshGeometry(); refreshColors();
}

function refreshGeometry(){
  for(let j=0;j<=H;j++){
    const y = BOTY + (j/H)*SPAN;
    for(let i=0;i<=R;i++){
      const r = rad[j*R + wrap(i)];
      const a = (i/R)*Math.PI*2;
      const v = (j*(R+1)+i)*3;
      meatPos[v]=Math.cos(a)*r; meatPos[v+1]=y; meatPos[v+2]=Math.sin(a)*r;
    }
  }
  meatGeo.attributes.position.needsUpdate = true;
  meatGeo.computeVertexNormals();
}

function refreshColors(){
  for(let j=0;j<=H;j++) for(let i=0;i<=R;i++){
    cookColor(cook[j*R + wrap(i)], _c);
    const v = (j*(R+1)+i)*3;
    meatCol[v]=_c[0]; meatCol[v+1]=_c[1]; meatCol[v+2]=_c[2];
  }
  meatGeo.attributes.color.needsUpdate = true;
}

// ───────────────────────── ateş
function sparkTexture(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,240,190,1)');
  g.addColorStop(0.35,'rgba(255,150,40,0.85)');
  g.addColorStop(1,'rgba(180,40,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}

function buildFire(){
  const N = 190, pos = new Float32Array(N*3);
  fireData = [];
  for(let k=0;k<N;k++){ fireData.push({}); respawnFlame(fireData[k], true); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  firePoints = new THREE.Points(geo, new THREE.PointsMaterial({
    size:0.36, map:sparkTexture(), transparent:true, depthWrite:false,
    blending:THREE.AdditiveBlending, opacity:0.85 }));
  scene.add(firePoints);
}
function respawnFlame(f, initial){
  const lv = Math.max(0.15, fireLevel);
  f.a = FIRE_A + (Math.random()-0.5)*(0.5 + 0.36*lv);
  f.y = -1.15 + (initial ? Math.random()*2.2 : Math.random()*0.18);
  f.vy = (0.55 + Math.random()*0.95) * (0.55 + 0.75*lv);
  f.max = (0.45 + Math.random()*0.7) * (0.7 + 0.45*lv);
  f.life = initial ? Math.random()*f.max : 0;
  f.sway = Math.random()*6.28;
  f.rr = 0.92 + Math.random()*0.2;
}
function updateFire(dt, time){
  firePoints.visible = fireLevel > 0.02;
  if(firePoints.visible){
    const p = firePoints.geometry.attributes.position.array;
    for(let k=0;k<fireData.length;k++){
      const f = fireData[k];
      f.life += dt;
      if(f.life > f.max) respawnFlame(f, false);
      f.y += f.vy*dt;
      const t = f.life/f.max;
      const a = f.a + Math.sin(time*3 + f.sway)*0.06*t;
      const rr = f.rr - t*0.18;
      p[k*3]=Math.cos(a)*rr; p[k*3+1]=f.y; p[k*3+2]=Math.sin(a)*rr;
    }
    firePoints.geometry.attributes.position.needsUpdate = true;
    firePoints.material.opacity = 0.25 + 0.48*Math.min(fireLevel,1.5);
    firePoints.material.size = 0.24 + 0.11*Math.min(fireLevel,1.5);
  }
  fireLight.intensity = (2.2 + Math.sin(time*13.7)*0.35 + Math.sin(time*7.1)*0.3) * fireLevel;
  const em = 0.12 + 1.35*fireLevel;
  for(let k=0;k<rodMats.length;k++) rodMats[k].emissiveIntensity = em;
}

// ───────────────────────── bıçak (yüzeye teğet duran uzun döner bıçağı)

// ───────────────────────── zerrecikler
function buildBits(){
  const N=70, pos=new Float32Array(N*3), col=new Float32Array(N*3);
  bitData=[];
  for(let k=0;k<N;k++){ bitData.push({life:0,x:0,y:-99,z:0,vx:0,vy:0,vz:0}); pos[k*3+1]=-99; }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  bits = new THREE.Points(geo, new THREE.PointsMaterial({ size:0.03, vertexColors:true, transparent:true, opacity:0.9 }));
  scene.add(bits);
}
function spawnBits(x,y,z,c,n){
  const cc = cookColor(c, [0,0,0]); let made=0;
  for(let k=0;k<bitData.length && made<n;k++){
    const b=bitData[k]; if(b.life>0) continue;
    b.life=0.45+Math.random()*0.4;
    b.x=x+(Math.random()-0.5)*0.05; b.y=y+(Math.random()-0.5)*0.05; b.z=z+(Math.random()-0.5)*0.05;
    b.vx=(Math.random()-0.5)*0.7; b.vy=0.15+Math.random()*0.5; b.vz=0.35+Math.random()*0.6;
    const a=bits.geometry.attributes.color.array;
    a[k*3]=cc[0]*1.15; a[k*3+1]=cc[1]*1.15; a[k*3+2]=cc[2]*1.15;
    made++;
  }
  bits.geometry.attributes.color.needsUpdate = true;
}
function updateBits(dt){
  const p=bits.geometry.attributes.position.array;
  for(let k=0;k<bitData.length;k++){
    const b=bitData[k];
    if(b.life<=0){ p[k*3+1]=-99; continue; }
    b.life-=dt; b.vy-=4.2*dt;
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.z+=b.vz*dt;
    p[k*3]=b.x; p[k*3+1]=b.y; p[k*3+2]=b.z;
  }
  bits.geometry.attributes.position.needsUpdate = true;
}

function buildSteam(){
  const N=70, pos=new Float32Array(N*3);
  steamData=[];
  for(let k=0;k<N;k++){ steamData.push({life:0,x:0,y:-99,z:0,vx:0,vy:0,ph:0,max:1}); pos[k*3+1]=-99; }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  steam = new THREE.Points(geo, new THREE.PointsMaterial({
    size:0.3, map:sparkTexture(), color:0xbdb6ab, transparent:true, opacity:0.22,
    depthWrite:false, blending:THREE.AdditiveBlending }));
  scene.add(steam);
}
function spawnSteam(x,y,z){
  for(let k=0;k<steamData.length;k++){
    const s=steamData[k]; if(s.life>0) continue;
    s.life=0.7+Math.random()*0.6; s.max=s.life;
    s.x=x; s.y=y; s.z=z;
    s.vx=(Math.random()-0.5)*0.25; s.vy=0.5+Math.random()*0.4; s.ph=Math.random()*6.28;
    return;
  }
}
function updateSteam(dt,time){
  const p=steam.geometry.attributes.position.array;
  for(let k=0;k<steamData.length;k++){
    const s=steamData[k];
    if(s.life<=0){ p[k*3+1]=-99; continue; }
    s.life-=dt; s.y+=s.vy*dt;
    s.x+=(s.vx+Math.sin(time*2.4+s.ph)*0.12)*dt; s.z+=0.1*dt;
    p[k*3]=s.x; p[k*3+1]=s.y; p[k*3+2]=s.z;
  }
  steam.geometry.attributes.position.needsUpdate = true;
}

// ───────────────────────── KESİM: düzlemsel tıraşlama
//
// Bıçak ete radyal olarak batmaz. Sabit bir dikey düzlem boyunca iner,
// düzlemin dışında kalan et tek parça ince bir yaprak olarak kalkar.
// Her halka için düzlemin eksene uzaklığı bir kez hesaplanır; aynı yerden
// tekrar geçmek oyuk açmaz, sadece düz bir yüz (facet) bırakır.

let stroke = null;
let peelMesh = null;

function beginStroke(phiLocal, y){
  const cols = [];
  const i0 = Math.round((phiLocal/(Math.PI*2))*R);
  for(let d=-NC; d<=NC; d++){
    // bıçak ağzı kenarlara doğru yüzeyden kalkar: şerit kenarında sıfıra iner
    const taper = Math.pow(Math.cos(0.5*Math.PI*Math.abs(d)/(NC+0.7)), 1.5);
    cols.push({ i: wrap(i0+d), da: d*(Math.PI*2/R), t: taper });
  }
  stroke = {
    phi: phiLocal,
    cols: cols,
    tgt: new Float32Array((H+1)*cols.length),
    hasT: new Uint8Array(H+1),
    snap: new Map(),
    jTop: 1e9, jBot: -1e9,
    lastJ: null,
    yBlade: y,
    removed: 0, cookSum: 0,
    lastBuild: -99
  };
}

function shaveRing(j){
  const st = stroke;
  if(j<0 || j>H) return;
  const n = st.cols.length, off = j*n;
  if(!st.hasT[j]){
    // hedef yüzey bir kez sabitlenir: aynı yerden tekrar geçmek oyuk açmaz
    for(let q=0;q<n;q++){
      const c = st.cols[q];
      st.tgt[off+q] = Math.max(MINR, rad[j*R+c.i] - SHAVE*c.t);
    }
    st.hasT[j] = 1;
  }
  for(let q=0;q<n;q++){
    const c = st.cols[q];
    const k = j*R + c.i;
    const old = rad[k], t = st.tgt[off+q];
    if(old > t + 0.0002){
      if(!st.snap.has(k)) st.snap.set(k, { r:old, c:cook[k] });
      st.removed += (old - t);
      st.cookSum += cook[k] * (old - t);
      rad[k] = t;
      cook[k] = 0.04 + cook[k]*0.10;
      geoDirty = true;
    }
  }
  if(j < st.jTop) st.jTop = j;
  if(j > st.jBot) st.jBot = j;
}

function carve(phiWorld, y){
  const st = stroke;
  st.yBlade = y;
  const j = clamp(Math.round(((y - BOTY)/SPAN)*H), 0, H);
  const from = st.lastJ === null ? j : st.lastJ;
  const step = from <= j ? 1 : -1;
  for(let jj=from; step>0 ? jj<=j : jj>=j; jj+=step) shaveRing(jj);
  st.lastJ = j;

  const ic = wrap(Math.round((st.phi/(Math.PI*2))*R));
  const rHere = rad[j*R+ic], cAt = cook[j*R+ic];
  const wx = Math.cos(phiWorld)*rHere, wz = Math.sin(phiWorld)*rHere;
  if(Math.random() < 0.5) spawnBits(wx, y, wz, cAt+0.15, 1);
  if(cAt > 0.4 && Math.random() < 0.4) spawnSteam(wx, y, wz);
  shake = Math.min(0.014, shake + 0.006);
}

// kalkan yaprak: bıçağın arkasında etten ayrılır ve kıvrılır
function buildPeelGeometry(detached){
  const st = stroke;
  const rows = st.jBot - st.jTop + 1;
  if(rows < 3) return null;
  const cols = st.cols.length;
  const pos = [], col = [], idx = [];
  const at = (L,c,r) => L*cols*rows + c*rows + r;

  let maxTh = 0;
  for(let L=0; L<2; L++){
    for(let c=0;c<cols;c++){
      const cc = st.cols[c];
      const a = (cc.i/R)*Math.PI*2, ca = Math.cos(a), sa = Math.sin(a);
      const edgeF = Math.abs(c-(cols-1)/2)/((cols-1)/2);
      for(let r=0;r<rows;r++){
        const j = st.jTop + r, k = j*R + cc.i;
        const s = st.snap.get(k);
        const ro = s ? s.r : rad[k];
        const act = ro - rad[k];
        if(act > maxTh) maxTh = act;
        const ri = ro - Math.max(act, 0.0032);   // çok ince şerit de görünsün
        const y = BOTY + (j/H)*SPAN;
        const d = detached ? 0.32 : Math.max(0, Math.abs(y - st.yBlade) - 0.05);
        const lift = Math.min(0.34, 1.15*Math.pow(d,1.55));
        const curl = 0.09*edgeF*edgeF;
        const rr = (L ? ri : ro) + lift + curl;
        pos.push(ca*rr, y - lift*0.22, sa*rr);
        const cv = s ? s.c : cook[k];
        cookColor(L ? cv*0.30 : cv, _c);
        col.push(_c[0], _c[1], _c[2]);
      }
    }
  }
  if(maxTh < 0.0012) return null;

  for(let L=0;L<2;L++) for(let c=0;c<cols-1;c++) for(let r=0;r<rows-1;r++)
    idx.push(at(L,c,r), at(L,c,r+1), at(L,c+1,r+1), at(L,c,r), at(L,c+1,r+1), at(L,c+1,r));
  for(let c=0;c<cols-1;c++){
    idx.push(at(0,c,0), at(0,c+1,0), at(1,c+1,0), at(0,c,0), at(1,c+1,0), at(1,c,0));
    idx.push(at(0,c,rows-1), at(0,c+1,rows-1), at(1,c+1,rows-1), at(0,c,rows-1), at(1,c+1,rows-1), at(1,c,rows-1));
  }
  for(let r=0;r<rows-1;r++){
    idx.push(at(0,0,r), at(0,0,r+1), at(1,0,r+1), at(0,0,r), at(1,0,r+1), at(1,0,r));
    idx.push(at(0,cols-1,r), at(0,cols-1,r+1), at(1,cols-1,r+1), at(0,cols-1,r), at(1,cols-1,r+1), at(1,cols-1,r));
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function peelMaterial(){
  return new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:0.55, metalness:0.03, side:THREE.DoubleSide });
}

function refreshPeel(){
  const st = stroke;
  if(!st) return;
  if(peelMesh && Math.abs(st.yBlade - st.lastBuild) < 0.012) return;
  st.lastBuild = st.yBlade;
  const g = buildPeelGeometry(false);
  if(!g) return;
  if(peelMesh){ peelMesh.geometry.dispose(); peelMesh.geometry = g; }
  else { peelMesh = new THREE.Mesh(g, peelMaterial()); donerGroup.add(peelMesh); }
}

function releasePeel(){
  if(!peelMesh) return null;
  donerGroup.remove(peelMesh);
  const g = buildPeelGeometry(true);
  peelMesh.geometry.dispose();
  peelMesh = null;
  if(!g) return null;
  g.applyMatrix4(donerGroup.matrixWorld);
  g.computeBoundingBox();
  const ctr = new THREE.Vector3();
  g.boundingBox.getCenter(ctr);
  g.translate(-ctr.x, -ctr.y, -ctr.z);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, peelMaterial());
  m.position.copy(ctr);
  return m;
}

function dropSlice(mesh, aWorld){
  const ox = Math.cos(aWorld), oz = Math.sin(aWorld);
  mesh.userData = {
    vx: ox*0.3 + (Math.random()-0.5)*0.1,
    vy: -0.08,
    vz: oz*0.3 + 0.18 + Math.random()*0.1,
    rx: (Math.random()-0.5)*1.4, ry:(Math.random()-0.5)*2.0, rz:(Math.random()-0.5)*1.4,
    ph: Math.random()*6.28, landed:false, age:0
  };
  scene.add(mesh);
  slices.push(mesh);
  if(slices.length > 30){
    const old = slices.shift();
    scene.remove(old); old.geometry.dispose(); old.material.dispose();
  }
}

function updateSlices(dt){
  for(let n=0;n<slices.length;n++){
    const s = slices[n], u = s.userData;
    u.age += dt;
    if(u.landed){
      s.rotation.x += ((-Math.PI/2) - s.rotation.x)*Math.min(1, dt*6);
      s.rotation.z += (0 - s.rotation.z)*Math.min(1, dt*6);
      continue;
    }
    u.vy -= 3.0*dt;
    const drag = Math.max(0, 1 - 2.0*dt);
    u.vx*=drag; u.vz*=drag; u.vy*=Math.max(0,1-1.2*dt);
    const sway = Math.sin(u.age*7.5 + u.ph)*0.4;
    s.position.x += (u.vx + sway*0.32)*dt;
    s.position.y += u.vy*dt;
    s.position.z += (u.vz + sway*0.18)*dt;
    s.rotation.x += u.rx*dt; s.rotation.y += u.ry*dt; s.rotation.z += (u.rz + sway*0.8)*dt;
    const onTray = Math.hypot(s.position.x, s.position.z-0.06) < 0.95;
    const floorY = onTray ? TRAY_Y + 0.05 + Math.min(n*0.002, 0.08) : -1.48;
    if(s.position.y < floorY){ s.position.y = floorY; u.landed = true; thud(); }
  }
}

// ───────────────────────── pişirme
function cookStep(dt){
  if(fireLevel <= 0.02) return;
  const rot = donerGroup.rotation.y;
  for(let i=0;i<R;i++){
    const d = Math.cos((i/R)*Math.PI*2 + rot - FIRE_A);
    if(d <= 0) continue;
    const ex = Math.pow(d,1.7)*0.135*fireLevel*dt;
    for(let j=0;j<=H;j++){
      const hf = 0.72 + 0.34*Math.sin(Math.PI*(j/H));
      const k = j*R+i;
      const v = cook[k] + ex*hf;
      cook[k] = v > 1.32 ? 1.32 : v;
    }
  }
}
function bladeCookAvg(){
  // bıçağın altındaki şeridin pişmişliği
  const local = CUT_PHI - donerGroup.rotation.y;
  const ic = Math.round((local/(Math.PI*2))*R);
  let sum=0, n=0;
  for(let d=-8; d<=8; d++){
    const i = wrap(ic+d);
    for(let j=8;j<=H-8;j+=2){ sum += cook[j*R+i]; n++; }
  }
  return n ? sum/n : 0;
}

// ───────────────────────── girdi
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const yPlane = new THREE.Plane(new THREE.Vector3(0,0,1), -0.35);
const hitPt = new THREE.Vector3();

let pointerDown=false, gesture=null, startX=0, startY=0, lastX=0, lastY=0;
let isTouch=false, cutting=false, knifePress=0;
let aimPhi = CUT_PHI, aimY = 0.2;

function updateAim(x, y){
  ndc.x = clamp((x/innerWidth)*2 - 1, -1, 1);
  ndc.y = -(y/innerHeight)*2 + 1 + (isTouch ? 0.06 : 0);
  // bıçak sabit: yatay hareket bıçağı değil, dönerin kendisini çevirir
  aimPhi = CUT_PHI;
  raycaster.setFromCamera(ndc, camera);
  if(raycaster.ray.intersectPlane(yPlane, hitPt)) aimY = clamp(hitPt.y, BOTY-0.1, TOPY+0.1);
}

function surfaceRadiusAt(phiWorld, y){
  const local = phiWorld - donerGroup.rotation.y;
  const i = wrap(Math.round((local/(Math.PI*2))*R));
  const j = clamp(Math.round(((y-BOTY)/SPAN)*H), 0, H);
  return rad[j*R+i];
}

function onDown(e){
  if(e.target.closest && e.target.closest('button')) return;
  pointerDown = true;
  isTouch = e.pointerType === 'touch';
  startX = lastX = e.clientX; startY = lastY = e.clientY;
  gesture = null;
  spinVel *= 0.15;
  updateAim(e.clientX, e.clientY);
  const cv = el('c');
  if(cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
}

function onMove(e){
  const x = e.clientX, y = e.clientY;
  updateAim(x, y);
  if(!pointerDown){ lastX=x; lastY=y; return; }

  const dx = x-startX, dy = y-startY;
  if(!gesture && Math.hypot(dx,dy) > 9){
    gesture = Math.abs(dx) > Math.abs(dy)*1.05 ? 'spin' : 'cut';
    if(gesture === 'cut'){
      beginStroke(aimPhi - donerGroup.rotation.y, aimY);
      cutting = true; spinVel = 0; startShave();
    }
  }

  if(gesture === 'spin'){
    const d = (x-lastX)*0.0115;
    donerGroup.rotation.y += d;
    spinVel = spinVel*0.55 + (d*48)*0.45;
  } else if(gesture === 'cut' && stroke){
    carve(stroke.phi + donerGroup.rotation.y, aimY);
    refreshPeel();
    knifePress = 1;
  }
  lastX=x; lastY=y;
}

function onUp(){
  if(gesture === 'cut' && stroke) endStroke();
  pointerDown = false; gesture = null; cutting = false;
  stopShave();
}

function endStroke(){
  const st = stroke;
  const mesh = releasePeel();
  if(mesh && st.removed > 0.018){
    dropSlice(mesh, st.phi + donerGroup.rotation.y);
    const avg = st.cookSum / st.removed;
    let pts, msg;
    if(avg < 0.30){ pts = -6; msg = 'Çiğ kesti'; combo = 0; }
    else if(avg < 0.52){ pts = Math.round(st.removed*48); msg = 'Az pişmiş'; combo = 0; }
    else if(avg <= 1.02){ combo++; pts = Math.round(st.removed*135*(1+Math.min(combo,8)*0.12));
      msg = combo>2 ? 'Usta işi' : 'Tam kıvamında'; }
    else { pts = Math.round(st.removed*20); msg = 'Yanmış'; combo = 0; }
    score = Math.max(0, score + pts);
    portions++;
    el('score').textContent = score;
    el('slices').textContent = portions;
    showStamp(msg, pts);
    updateCombo();
  } else if(mesh){
    mesh.geometry.dispose(); mesh.material.dispose();
  }
  stroke = null;
}

function updateCombo(){
  const c = el('combo');
  if(combo > 1){ c.textContent = combo + '× üst üste'; c.classList.add('on'); }
  else c.classList.remove('on');
}

let stampTimer;
function showStamp(msg, pts){
  const s = el('stamp');
  s.innerHTML = msg + '<span class="pts">' + (pts>=0?'+':'') + pts + ' puan</span>';
  s.classList.remove('show'); void s.offsetWidth; s.classList.add('show');
  clearTimeout(stampTimer);
  stampTimer = setTimeout(()=> s.classList.remove('show'), 900);
}

// ───────────────────────── ses
let actx=null, soundOn=false, sizzleGain=null, noiseBuf=null, shaveGain=null;
function initAudio(){
  if(actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  actx = new AC();
  const len = actx.sampleRate*2;
  noiseBuf = actx.createBuffer(1,len,actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;

  const s1 = actx.createBufferSource(); s1.buffer=noiseBuf; s1.loop=true;
  const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=0.7;
  sizzleGain = actx.createGain(); sizzleGain.gain.value=0;
  s1.connect(bp); bp.connect(sizzleGain); sizzleGain.connect(actx.destination); s1.start();

  const s2 = actx.createBufferSource(); s2.buffer=noiseBuf; s2.loop=true;
  const bp2 = actx.createBiquadFilter(); bp2.type='bandpass'; bp2.frequency.value=1500; bp2.Q.value=2.2;
  shaveGain = actx.createGain(); shaveGain.gain.value=0;
  s2.connect(bp2); bp2.connect(shaveGain); shaveGain.connect(actx.destination); s2.start();
}
function startShave(){
  if(!soundOn || !shaveGain) return;
  shaveGain.gain.cancelScheduledValues(actx.currentTime);
  shaveGain.gain.setTargetAtTime(0.09, actx.currentTime, 0.03);
}
function stopShave(){
  if(!shaveGain) return;
  shaveGain.gain.cancelScheduledValues(actx.currentTime);
  shaveGain.gain.setTargetAtTime(0.0, actx.currentTime, 0.05);
}
function thud(){
  if(!soundOn || !actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(150, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(70, actx.currentTime+0.12);
  g.gain.setValueAtTime(0.1, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.16);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.18);
}

// ───────────────────────── döngü
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if(!cutting){
    if(spinRate > 0) donerGroup.rotation.y += spinRate*dt;
    if(!pointerDown || gesture !== 'spin'){
      donerGroup.rotation.y += spinVel*dt;
      spinVel *= Math.pow(0.035, dt);
      if(Math.abs(spinVel) < 0.001) spinVel = 0;
    }
  }
  donerGroup.updateMatrixWorld();

  cookStep(dt);
  if(geoDirty){ refreshGeometry(); geoDirty=false; }
  if((colorTick++ & 1) === 0) refreshColors();

  updateFire(dt,t); updateBits(dt); updateSteam(dt,t); updateSlices(dt);

  // bıçağı yüzeye teğet yerleştir
  knifePress += (0 - knifePress)*Math.min(1, dt*5);
  const gap = cutting ? 0.015 : 0.13;
  const rs = surfaceRadiusAt(aimPhi, aimY) + gap;
  const k = Math.min(1, dt*20);
  knife.position.x += (Math.cos(aimPhi)*rs - knife.position.x)*k;
  knife.position.y += (aimY - 0.06 - knife.position.y)*k;
  knife.position.z += (Math.sin(aimPhi)*rs - knife.position.z)*k;
  knife.rotation.y += ((Math.PI/2 - aimPhi) - knife.rotation.y)*Math.min(1, dt*14);
  knifeTilt.rotation.z = -0.42 - knifePress*0.05 + (pointerDown ? 0 : Math.sin(t*1.5)*0.015);
  knifeRoll.rotation.y = -0.26 + knifePress*0.14;   // keserken ağız ete yatar
  bladeGlow.material.opacity = knifePress*0.8;

  if(sizzleGain){
    const target = soundOn ? 0.035 + Math.abs(Math.sin(t*2.3))*0.012 : 0;
    sizzleGain.gain.value += (target - sizzleGain.gain.value)*Math.min(1, dt*3);
  }

  shake = Math.max(0, shake - dt*0.09);
  camera.position.set(camBase.x + (Math.random()-0.5)*shake, camBase.y + (Math.random()-0.5)*shake, camBase.z);
  camera.lookAt(0, 0.02, 0);

  updateGauge();
  renderer.render(scene, camera);
}

let gaugeTick=0;
function updateGauge(){
  if((gaugeTick++ % 6) !== 0) return;
  const c = bladeCookAvg();
  el('gaugeFill').style.height = Math.min(100,(c/1.2)*100) + '%';
  const lbl = c<0.28 ? 'Çiğ' : c<0.52 ? 'Pişiyor' : c<=1.02 ? 'Hazır' : 'Yanıyor';
  const g = el('gaugeLabel');
  g.textContent = lbl;
  g.style.color = c>1.02 ? '#ff7a4a' : c>0.52 ? '#f0b45c' : '#cbbca9';
}

function resize(){
  const w=innerWidth, h=innerHeight, aspect=w/h;
  camera.aspect = aspect;
  const baseFov = 42;
  camera.fov = aspect < 1
    ? Math.min(78, THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(THREE.MathUtils.degToRad(baseFov)/2)/aspect)))
    : baseFov;
  camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
}

// ───────────────────────── arayüz
const cnv = el('c');
cnv.addEventListener('pointerdown', onDown);
addEventListener('pointermove', onMove, { passive:true });
addEventListener('pointerup', onUp);
addEventListener('pointercancel', onUp);
addEventListener('contextmenu', e => e.preventDefault());

function applyFireDial(v){
  fireLevel = (v/100) * 1.5;
  el('fireVal').textContent =
    fireLevel < 0.03 ? 'Sönük' :
    fireLevel < 0.45 ? 'Kısık'  :
    fireLevel < 0.85 ? 'Orta'   :
    fireLevel < 1.25 ? 'Harlı'  : 'Cayır cayır';
}
function applySpinDial(v){
  spinRate = (v/100) * 1.8;
  el('spinVal').textContent = spinRate < 0.02
    ? 'Kapalı'
    : (spinRate/(Math.PI*2)*60).toFixed(0) + ' dev/dk';
}
el('fireDial').addEventListener('input', function(){ applyFireDial(+this.value); });
el('spinDial').addEventListener('input', function(){ applySpinDial(+this.value); });
applyFireDial(+el('fireDial').value);
applySpinDial(+el('spinDial').value);

el('soundBtn').addEventListener('click', function(){
  initAudio();
  if(actx && actx.state === 'suspended') actx.resume();
  soundOn = !soundOn;
  this.classList.toggle('on', soundOn);
  this.textContent = soundOn ? 'Sesi kapat' : 'Sesi aç';
});
el('resetBtn').addEventListener('click', function(){
  resetDoner();
  combo = 0; updateCombo();
  for(let n=0;n<slices.length;n++){
    const s = slices[n]; scene.remove(s); s.geometry.dispose(); s.material.dispose();
  }
  slices.length = 0;
  showStamp('Taze döner takıldı', 0);
});
el('startBtn').addEventListener('click', function(){
  el('intro').classList.add('hide');
  setTimeout(()=> el('intro').style.display='none', 480);
});

init();
})();
</script>
