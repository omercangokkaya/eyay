<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d2131;
    --line: #1f3f57;
    --line-soft: #16324670;
    --paper: #eef4f2;
    --paper-dim: #a9c2ce;
    --gold: #f2b705;
    --gold-dim: #caa23a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--ink);
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 34px 34px;
    color: var(--paper);
    font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ---------- Cards ---------- */
  .cards {
    width: min(92vw, 720px);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    padding: 24px;
  }

  .card {
    position: relative;
    border-radius: 6px;
    padding: 24px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
  }

  .card--featured {
    grid-column: span 2;
    background: linear-gradient(155deg, #123449, #0d2434);
    border: 1px solid var(--line);
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    min-height: 260px;
    transition: transform 0.18s ease, border-color 0.18s ease;
  }

  .card--featured:hover {
    transform: translateY(-2px);
    border-color: var(--gold-dim);
  }

  .card--featured .logo-mark {
    filter: drop-shadow(0 0 14px rgba(242,183,5,0.35));
  }

  .card--featured h1 {
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .card--game {
    background: linear-gradient(155deg, #123449, #0d2434);
    border: 1px solid var(--line);
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    transition: transform 0.18s ease, border-color 0.18s ease;
  }

  .card--game:hover {
    transform: translateY(-2px);
    border-color: var(--gold-dim);
  }

  .card--game .logo-mark {
    filter: drop-shadow(0 0 12px rgba(242,183,5,0.3));
  }

  .card--game h2 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .card--slot {
    border: 1px dashed var(--line);
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 6px;
    color: var(--paper-dim);
  }

  .card--slot .slot-mark {
    font-size: 1.3rem;
    color: var(--line);
  }

  .card--slot .slot-label {
    font-size: 0.85rem;
  }

  @media (max-width: 560px) {
    .cards { grid-template-columns: 1fr; }
    .card--featured { grid-column: span 1; }
  }
</style>
</head>
<body>

  <div class="cards">
    <a class="card card--featured" href="maze/maze.html">
      <svg class="logo-mark" width="56" height="56" viewBox="0 0 48 48" fill="none">
        <path d="M10,10 H38" stroke="#eef4f2" stroke-width="4" stroke-linecap="round"/>
        <path d="M10,10 V38" stroke="#eef4f2" stroke-width="4" stroke-linecap="round"/>
        <path d="M10,38 H38" stroke="#eef4f2" stroke-width="4" stroke-linecap="round"/>
        <path d="M38,10 V19" stroke="#eef4f2" stroke-width="4" stroke-linecap="round"/>
        <path d="M38,29 V38" stroke="#eef4f2" stroke-width="4" stroke-linecap="round"/>
        <path d="M33,14 L46,24 L33,34" stroke="#f2b705" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Phase Runner</h1>
    </a>

    <a class="card card--game" href="doner/doner.html">
      <svg class="logo-mark" width="44" height="44" viewBox="0 0 48 48" fill="none">
        <path d="M24,8 V44" stroke="#eef4f2" stroke-width="3" stroke-linecap="round"/>
        <path d="M24,8 L35,40 H13 Z" stroke="#eef4f2" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M19,18 H29" stroke="#eef4f2" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M16.5,26 H31.5" stroke="#eef4f2" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M14.5,34 H33.5" stroke="#eef4f2" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M30,29 L45,18" stroke="#f2b705" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
      <h2>Döner Kesme</h2>
    </a>

    <div class="card card--slot">
      <div class="slot-mark">＋</div>
      <div class="slot-label mono">yakında</div>
    </div>
  </div>

</body>
</html>
